<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <title>Bütçem Pro | Kişisel Finans ve Bütçe Takip Portalı</title>
  <style>
    html,body{height:100%;margin:0;background:#0f172a;color:#e2e8f0;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
    #loading{display:flex;min-height:100vh;align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:24px;text-align:center;box-sizing:border-box}
    .status{font-size:14px;color:#94a3b8;max-width:480px;line-height:1.6}
    .spin{width:30px;height:30px;border:3px solid #334155;border-top-color:#818cf8;border-radius:50%;animation:spin .7s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <main id="loading" role="status" aria-live="polite">
    <div class="spin" aria-hidden="true"></div>
    <strong>Bütçem Pro</strong>
    <div class="status" id="status">Bütçe uygulaması yükleniyor...</div>
  </main>
  <!-- Kategori filtreleri ve alt kategori detayları aynı HTML dosyasının içine gömülüdür. -->
  <script id="butcem-features" type="text/plain">
/*
 * Bütçem Pro — Harcama kategori filtreleri ve istatistik alt kategori detayları.
 * Mevcut localStorage verilerini değiştirmez; mevcut işlevleri geliştirir.
 */
(() => {
    'use strict';

    let openSubcategoryKey = null;
    const filterInputClass = 'w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-indigo-500 text-slate-200';

    function escapeHtml(value) {
        return String(value ?? '').replace(/[&<>"']/g, char => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        })[char]);
    }

    function setupTransactionFilters() {
        const search = document.getElementById('searchTransactionInput');
        if (!search || document.getElementById('filterTransactionCategory')) return;

        const container = search.parentElement;
        container.className = 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-2';
        search.type = 'search';
        search.setAttribute('aria-label', 'Harcamalarda ara');

        const category = document.createElement('select');
        category.id = 'filterTransactionCategory';
        category.className = filterInputClass;
        category.setAttribute('aria-label', 'Kategoriye göre filtrele');
        category.innerHTML = '<option value="">Tüm kategoriler</option>';
        category.addEventListener('change', () => {
            document.getElementById('filterTransactionSubCategory').value = '';
            window.renderTransactions();
        });

        const subcategory = document.createElement('select');
        subcategory.id = 'filterTransactionSubCategory';
        subcategory.className = filterInputClass + ' disabled:opacity-50';
        subcategory.setAttribute('aria-label', 'Alt kategoriye göre filtrele');
        subcategory.innerHTML = '<option value="">Tüm alt kategoriler</option>';
        subcategory.disabled = true;
        subcategory.addEventListener('change', () => window.renderTransactions());

        const clear = document.createElement('button');
        clear.type = 'button';
        clear.className = 'rounded-xl border border-slate-700 px-3 py-2 text-xs font-semibold text-slate-300 hover:bg-slate-800 hover:text-white transition';
        clear.innerHTML = '<i class="fa-solid fa-filter-circle-xmark mr-1"></i> Filtreleri Temizle';
        clear.addEventListener('click', () => {
            search.value = '';
            category.value = '';
            subcategory.value = '';
            window.renderTransactions();
        });

        container.append(category, subcategory, clear);
        const summary = document.createElement('p');
        summary.id = 'transactionFilterSummary';
        summary.className = 'text-[11px] text-slate-400 px-1 mt-2';
        summary.setAttribute('aria-live', 'polite');
        container.insertAdjacentElement('afterend', summary);
    }

    function populateSelect(select, options, placeholder) {
        const previous = select.value;
        select.innerHTML = `<option value="">${placeholder}</option>` +
            options.map(value => `<option value="${escapeHtml(value)}">${escapeHtml(value)}</option>`).join('');
        select.value = options.includes(previous) ? previous : '';
    }

    function refreshTransactionFilters(monthTransactions) {
        setupTransactionFilters();
        const category = document.getElementById('filterTransactionCategory');
        const subcategory = document.getElementById('filterTransactionSubCategory');
        const categories = [...new Set([
            ...appData.categories.map(c => c.name),
            ...monthTransactions.map(t => t.category)
        ])].filter(Boolean);
        populateSelect(category, categories, 'Tüm kategoriler');

        if (!category.value) {
            populateSelect(subcategory, [], 'Tüm alt kategoriler');
            subcategory.disabled = true;
            return;
        }
        const configured = appData.categories.find(c => c.name === category.value);
        const subs = [...new Set([
            ...(configured?.subs || []),
            ...monthTransactions.filter(t => t.category === category.value).map(t => t.subCategory || 'Diğer')
        ])].filter(Boolean);
        populateSelect(subcategory, subs, 'Tüm alt kategoriler');
        subcategory.disabled = false;
    }

    window.renderTransactions = function renderFilteredTransactions() {
        const monthTransactions = getMonthlyCalculations(currentYear, currentMonth).monthTx;
        refreshTransactionFilters(monthTransactions);

        const query = (document.getElementById('searchTransactionInput').value || '').trim().toLocaleLowerCase('tr-TR');
        const category = document.getElementById('filterTransactionCategory').value;
        const subcategory = document.getElementById('filterTransactionSubCategory').value;
        const filtered = monthTransactions.filter(tx => {
            const cat = tx.category || '';
            const sub = tx.subCategory || 'Diğer';
            return (!category || cat === category) &&
                (!subcategory || sub === subcategory) &&
                [tx.title || '', cat, sub].some(v => String(v).toLocaleLowerCase('tr-TR').includes(query));
        });

        const total = filtered.reduce((sum, tx) => sum + (parseFloat(tx.amount) || 0), 0);
        document.getElementById('transactionFilterSummary').textContent =
            `${filtered.length} harcama • Toplam: ${formatCurrency(total)}`;

        const tbody = document.getElementById('fullTransactionsTable');
        if (!filtered.length) {
            tbody.innerHTML = '<tr><td colspan="6" class="py-6 text-center text-slate-500 italic">Seçilen filtrelere uygun harcama bulunamadı.</td></tr>';
            return;
        }
        tbody.innerHTML = filtered.slice().reverse().map(tx => `
            <tr class="hover:bg-slate-800/40 transition">
                <td class="py-3 px-4 text-slate-400">${escapeHtml(tx.date)}</td>
                <td class="py-3 px-4 font-semibold text-slate-200">${escapeHtml(tx.title)}</td>
                <td class="py-3 px-4"><span class="px-2 py-0.5 rounded-md bg-slate-800 text-slate-300 text-[11px]">${escapeHtml(tx.category)}</span></td>
                <td class="py-3 px-4 text-slate-400">${escapeHtml(tx.subCategory || 'Diğer')}</td>
                <td class="py-3 px-4 text-right font-bold text-rose-400">-${formatCurrency(tx.amount)}</td>
                <td class="py-3 px-4 text-center">
                    <button type="button" data-tx-id="${escapeHtml(tx.id)}" aria-label="Harcamayı sil" class="text-slate-500 hover:text-rose-400 p-1" onclick="deleteTransaction(this.dataset.txId)"><i class="fa-solid fa-trash-can"></i></button>
                </td>
            </tr>
        `).join('');
    };

    // The existing report groups fixed expenses and installments by category only.
    // Subcategory drilldowns therefore show the related variable transactions.
    const originalRenderDetailedCategoryBreakdown = window.renderDetailedCategoryBreakdown;
    window.renderDetailedCategoryBreakdown = function renderDetailedCategoryBreakdownWithDrilldowns() {
        originalRenderDetailedCategoryBreakdown();
        const tbody = document.getElementById('detailedCategoryBreakdown');
        const monthTransactions = getMonthlyCalculations(currentYear, currentMonth).monthTx;
        let categoryName = null;
        let rowIndex = 0;

        for (const row of [...tbody.rows]) {
            if (row.classList.contains('detail-row')) {
                categoryName = row.cells[0]?.textContent.trim() || null;
                continue;
            }
            if (!row.classList.contains('subcat-row') || !categoryName) continue;
            const subName = row.cells[0]?.textContent.trim() || '';
            const related = monthTransactions
                .filter(tx => tx.category === categoryName && (tx.subCategory || 'Diğer') === subName)
                .slice().sort((a, b) => (b.date || '').localeCompare(a.date || ''));
            if (!related.length) continue;

            const stateKey = JSON.stringify([getCurrentKey(), categoryName, subName]);
            const expanded = stateKey === openSubcategoryKey;
            const detailsId = `subcategory-expenses-${rowIndex++}`;
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'inline-flex items-center gap-2 rounded-lg px-1.5 py-1 text-left text-indigo-300 hover:text-indigo-200 hover:bg-indigo-500/10 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition';
            button.innerHTML = `<i class="fa-solid ${expanded ? 'fa-chevron-down' : 'fa-chevron-right'} text-[10px]"></i><span>${escapeHtml(subName)}</span>`;
            button.setAttribute('aria-expanded', String(expanded));
            button.setAttribute('aria-controls', detailsId);
            button.setAttribute('aria-label', `${subName} harcamalarını ${expanded ? 'gizle' : 'göster'}`);
            button.addEventListener('click', () => {
                openSubcategoryKey = openSubcategoryKey === stateKey ? null : stateKey;
                window.renderDetailedCategoryBreakdown();
            });
            row.cells[0].replaceChildren(button);

            if (expanded) {
                const detailRow = document.createElement('tr');
                detailRow.id = detailsId;
                detailRow.className = 'bg-slate-900/50';
                const total = related.reduce((sum, tx) => sum + (parseFloat(tx.amount) || 0), 0);
                detailRow.innerHTML = `
                    <td colspan="6" class="px-4 py-3 sm:pl-12">
                        <div class="rounded-xl border border-indigo-500/20 bg-slate-800/40 p-3 space-y-2">
                            <div class="flex flex-wrap justify-between items-center gap-2 pb-1">
                                <span class="text-xs font-semibold text-indigo-200">${escapeHtml(subName)} • ${related.length} harcama</span>
                                <span class="text-xs font-bold text-rose-300">${formatCurrency(total)}</span>
                            </div>
                            ${related.map(tx => `
                                <div class="flex items-center justify-between gap-3 border-t border-slate-700/50 pt-2">
                                    <div class="min-w-0">
                                        <p class="text-xs font-medium text-slate-200 break-words">${escapeHtml(tx.title || 'Açıklamasız harcama')}</p>
                                        <p class="text-[11px] text-slate-400">${escapeHtml(tx.date || 'Tarih yok')}</p>
                                    </div>
                                    <span class="text-xs font-semibold text-rose-300 whitespace-nowrap">-${formatCurrency(tx.amount)}</span>
                                </div>
                            `).join('')}
                        </div>
                    </td>
                `;
                row.insertAdjacentElement('afterend', detailRow);
            }
        }
        if (!document.getElementById('subcategoryDrilldownHint')) {
            const table = tbody.closest('.overflow-x-auto');
            if (table) {
                const hint = document.createElement('p');
                hint.id = 'subcategoryDrilldownHint';
                hint.className = 'text-[11px] text-slate-400 mb-2';
                hint.textContent = 'Alt kategori adına tıklayarak o ay yapılan ekstra harcamaları görüntüleyin.';
                table.insertAdjacentElement('beforebegin', hint);
            }
        }
    };

    const previousOnload = window.onload;
    window.onload = function (event) {
        setupTransactionFilters();
        if (typeof previousOnload === 'function') previousOnload.call(this, event);
    };
})();

  </script>
  <script>
    (async () => {
      const versionedSource = 'https://raw.githubusercontent.com/yunusugdul/butcem/cd740af5d795db494a6c05e717c18bff4aadb5bc/index.html';
      const status = document.getElementById('status');
      try {
        const response = await fetch(versionedSource);
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const app = await response.text();
        if (!app.includes('id="tab-transactions"') || !app.includes('renderDetailedCategoryBreakdown')) {
          throw new Error('Kaynak kod doğrulanamadı');
        }
        const featureSource = document.getElementById('butcem-features').textContent;
        // Uygulamanın sonuna geliştirme kodu eklenir.
        const scriptEnd = '</scr' + 'ipt>';
        const injectedApp = app.replace(/<\/body>\s*<\/html>\s*$/i,
            '<script>' + featureSource + scriptEnd + '\n</body>\n</html>');
        if (injectedApp === app) throw new Error('HTML birleştirilemedi');
        document.open();
        document.write(injectedApp);
        document.close();
      } catch (error) {
        console.error('Bütçem uygulaması yüklenemedi:', error);
        status.textContent = 'Uygulama yüklenemedi. İnternet bağlantınızı kontrol edip sayfayı yenileyin.';
        const spinner = document.querySelector('.spin');
        if (spinner) spinner.hidden = true;
      }
    })();
  </script>
</body>
</html>
